version: "2"

servers:
    - engine: postgresql
      uri: "postgresql://postgres@localhost:5432/timesheet_helper?sslmode=disable"
sql:
    - name: "standard"
      engine: "postgresql"
      schema: "database/migrations/standard"
      queries: "database/queries/stable"
      database:
          managed: true
      gen:
          go:
              package: "database"
              out: "internal/database"
              sql_package: "database/sql"
    - name: "rag_knowledge_base"
      engine: "postgresql"
      schema: "database/migrations/rag_knowledge_base"
      database:
          managed: true
      gen:
          go:
              package: "database"
              out: "internal/rag"
              sql_package: "database/sql"
