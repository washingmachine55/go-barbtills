version: "2"

servers:
    - engine: postgresql
      uri: "postgresql://postgres@localhost:5432/timesheet_helper?sslmode=disable"
sql:
    - engine: "postgresql"
      schema: "database/migrations"
      queries: "database/queries/query.sql"
      database:
          managed: true
      gen:
          go:
              package: "database"
              out: "internal/database"
              sql_package: "database/sql"
