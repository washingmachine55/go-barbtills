version: "2"

# Connection used only to host sqlc's ephemeral "managed" databases, which it
# builds by replaying database/migrations. Deliberately NOT the working
# database: a misconfigured servers block makes sqlc operate on it directly.
servers:
    - engine: postgresql
      uri: "postgresql://postgres@localhost:5432/postgres?sslmode=disable"
sql:
    - engine: "postgresql"
      schema: "database/migrations"
      queries: "database/queries/stable"
      database:
          managed: true
      gen:
          go:
              package: "database"
              out: "internal/database"
              sql_package: "database/sql"
